name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor: that is where Node began running .ts files
        # natively, and the scripts and tests rely on it (no build step).
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # No database, no API key, no network. If this needs a secret,
        # something has leaked out of the lab's mock boundary.
        run: npm test

      # `npm run build` is deliberately not run here: it imports supabase.ts,
      # which requires NEXT_PUBLIC_SUPABASE_* at module load. Adding project
      # secrets to CI for a demo lab is not worth it.
